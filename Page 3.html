<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
    <style>
        body {
            background-color: black;
            color: pink;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        
        .container {
            width: 80%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid pink;
        }

        th, td {
            border: 1px solid pink;
            padding: 12px;
            text-align: left;
        }

        th {
            width: 35%;
        }

        input, select {
            width: 100%;
            padding: 8px;
            background-color: #1a1a1a;
            color: pink;
            border: 1px solid pink;
            border-radius: 4px;
            box-sizing: border-box;
        }

        ::placeholder {
            color: #ffb6c1;
            opacity: 0.7;
        }

        .next-page-link {
            color: pink;
            text-decoration: underline;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <table>
        <tr>
            <th>Field</th>
            <th>Input Your Data</th>
        </tr>
        <tr>
            <td><label for="name">Name</label></td>
            <td><input type="text" id="name" placeholder="Enter your full name"></td>
        </tr>
        <tr>
            <td><label for="age">Age</label></td>
            <td><input type="number" id="age" placeholder="Enter your age"></td>
        </tr>
        <tr>
            <td><label for="sex">Sex</label></td>
            <td>
                <select id="sex">
                    <option value="" disabled selected>Select sex</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="birthdate">Birthdate</label></td>
            <td><input type="date" id="birthdate"></td>
        </tr>
        <tr>
            <td><label for="civil-status">Civil Status</label></td>
            <td>
                <select id="civil-status">
                    <option value="" disabled selected>Select status</option>
                    <option value="single">Single</option>
                    <option value="married">Married</option>
                    <option value="widowed">Widowed</option>
                    <option value="separated">Separated</option>
                </select>
            </td>
        </tr>
    </table>

    <a href="Page 2.html" class="next-page-link">Go to Page 2</a>
</div>

</body>
</html>
